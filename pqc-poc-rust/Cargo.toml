[package]
name = "pqc_poc_rust"
version = "0.1.0"
edition = "2021"
description = "M63 C4 Rust mobile PQC fallback spike (ML-DSA-65 + ML-KEM-768)"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "c4roundtrip"
path = "src/bin/c4roundtrip.rs"

[[bin]]
name = "m63_mldsa_cli"
path = "src/bin/m63_mldsa_cli.rs"

[dependencies]
ml-dsa = { version = "0.1.1", default-features = false, features = ["alloc"] }
ml-kem = { version = "0.3.2", default-features = false, features = ["alloc", "getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[profile.release]
lto = true
opt-level = "z"
strip = "debuginfo"
codegen-units = 1