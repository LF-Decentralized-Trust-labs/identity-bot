name: Desktop — Windows Release

# Desktop release build.
# migration. Produces identity-agent-windows-x64.zip as a build artifact.
on:
  workflow_dispatch:
  push:
    branches: [ "ci/github-actions-desktop" ]
    paths:
      - "identity-agent-core/**"
      - "identity_agent_ui/**"
      - "drivers/**"
      - "sandbox-apps/go-demo/**"
      - "manifests/**"
      - "scripts/build-desktop-windows.ps1"
      - ".github/workflows/desktop-windows.yml"

jobs:
  windows:
    runs-on: windows-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.0"

      # Latest stable Flutter: 3.27.3 fell back to the "Visual Studio 16 2019"
      # generator and couldn't find VS on the VS-2022 windows-latest runner.
      # A current Flutter detects VS 2022. (The login/credential-gating logic
      # lives in the Go backend, so the UI's Flutter version is not load-bearing;
      # the resulting .exe still targets Windows 10+.)
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Diagnose toolchain (Flutter + Visual Studio detection)
        shell: pwsh
        run: |
          flutter --version
          flutter doctor -v

      - name: Build + bundle Windows release
        shell: pwsh
        run: ./scripts/build-desktop-windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: identity-agent-windows-x64
          path: identity-agent-windows-x64.zip
          if-no-files-found: error
