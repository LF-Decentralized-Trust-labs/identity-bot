name: Desktop — Linux Release

# Desktop release build.
# migration. Produces identity-agent-linux-x64.tar.gz as a build artifact.
on:
  workflow_dispatch:
  push:
    branches: [ "ci/github-actions-desktop" ]
    paths:
      - "identity-agent-core/**"
      - "identity_agent_ui/**"
      - "drivers/**"
      - "sandbox-apps/go-demo/**"
      - "manifests/**"
      - "scripts/build-desktop-linux.sh"
      - ".github/workflows/desktop-linux.yml"

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.0"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.3"
          channel: stable

      - name: Build + bundle Linux release
        run: bash scripts/build-desktop-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: identity-agent-linux-x64
          path: identity-agent-linux-x64.tar.gz
          if-no-files-found: error
