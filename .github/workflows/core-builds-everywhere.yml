name: Core — builds everywhere

# Every pull request must build the Identity Agent core, agent-host included,
# for Linux, macOS and Windows, pass go vet on each, and pass its tests. Code
# behind a build constraint compiles only on the systems it names, so a change
# built and tested on one system can leave another one broken without anything
# saying so.
#
# Cross-compiled from one Linux runner with cgo off, for every system and
# architecture; and built natively on macOS with cgo on, because the files that
# talk to the Secure Enclave are cgo and a cgo-off build leaves them out.
on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-builds-${{ github.ref }}
  # A newer push to a pull request replaces its run; every push to main is checked.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        goos: [ linux, darwin, windows ]
        goarch: [ amd64, arm64 ]
    defaults:
      run:
        working-directory: identity-agent-core
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: identity-agent-core/go.mod
          cache-dependency-path: identity-agent-core/go.sum
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...

  build-macos-cgo:
    name: build darwin/arm64 (cgo)
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: identity-agent-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: identity-agent-core/go.mod
          cache-dependency-path: identity-agent-core/go.sum
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...

  test:
    name: test linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: identity-agent-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: identity-agent-core/go.mod
          cache-dependency-path: identity-agent-core/go.sum
      - name: go test
        run: go test -count=1 -timeout 20m ./...
      # The wire-protocol modules nested inside the core are modules of their own,
      # which ./... does not reach.
      - name: go vet and test the nested modules
        run: |
          for m in relayproto witnessproto; do
            (cd "$m" && go vet ./... && go test -count=1 ./...)
          done
