name: Core — builds everywhere

# Every pull request must build the Identity Agent core, agent-host included,
# for Linux, macOS and Windows, type-check it for Android and iOS, pass go vet,
# and pass its tests. Code behind a build constraint compiles only on the
# systems it names, so a change built and tested on one system can leave
# another one broken without anything saying so.
#
# - Linux, macOS and Windows on amd64 and arm64: cross-compiled from one Linux
#   runner with cgo off, and vetted.
# - Android: vetted from the Linux runner with cgo off (its key-hardware files
#   are pure Go).
# - macOS with cgo: built and vetted natively on amd64 and arm64, because the
#   Secure Enclave files are cgo and a cgo-off build leaves them out; and
#   vetted with -tags sepblob, the shipping build's Secure Enclave signer,
#   whose library vet does not need since it does not link.
# - iOS: vetted on the macOS runner with cgo on. Vet type-checks; nothing is
#   linked for iOS.
on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to a pull request replaces its run. Each push to main is its
  # own group, so none is dropped.
  group: core-builds-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        goos: [ linux, darwin, windows ]
        goarch: [ amd64, arm64 ]
    defaults:
      run:
        working-directory: identity-agent-core
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: identity-agent-core/go.mod
          cache-dependency-path: identity-agent-core/**/go.sum
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...

  vet-android:
    name: vet android/arm64
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: identity-agent-core
    env:
      CGO_ENABLED: "0"
      GOOS: android
      GOARCH: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: identity-agent-core/go.mod
          cache-dependency-path: identity-agent-core/**/go.sum
      - name: go vet
        run: go vet ./...

  build-macos-cgo:
    name: build darwin (cgo), vet sepblob and ios
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: identity-agent-core
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: identity-agent-core/go.mod
          cache-dependency-path: identity-agent-core/**/go.sum
      - name: go build and vet, darwin/arm64
        run: go build ./... && go vet ./...
      - name: go build and vet, darwin/amd64
        env:
          GOARCH: amd64
          CGO_ENABLED: "1"
        run: go build ./... && go vet ./...
      - name: go vet, the shipping Secure Enclave signer (-tags sepblob)
        run: go vet -tags sepblob ./...
      - name: go vet, ios/arm64
        env:
          GOOS: ios
          GOARCH: arm64
          CGO_ENABLED: "1"
        run: go vet ./...

  test:
    name: test linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: identity-agent-core
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: identity-agent-core/go.mod
          cache-dependency-path: identity-agent-core/**/go.sum
      - name: go test
        run: go test -count=1 -timeout 20m ./...
      # The wire-protocol modules nested inside the core are modules of their own,
      # which ./... does not reach.
      - name: go vet and test the nested modules
        run: |
          for m in relayproto witnessproto; do
            (cd "$m" && go vet ./... && go test -count=1 ./...)
          done
