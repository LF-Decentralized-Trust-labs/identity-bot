// Compiles the plugin's Kotlin against the Android SDK and Flutter's embedding, with no
// Flutter app around it (`./compile.sh`). It proves the Kotlin type-checks; it does not run it.
plugins { id 'com.android.library' version '8.5.1'; id 'org.jetbrains.kotlin.android' version '2.1.0' }
repositories { google(); mavenCentral(); maven { url 'https://storage.googleapis.com/download.flutter.io' } }
android {
    namespace 'org.identityagent.login_flutter'
    compileSdk 34
    defaultConfig { minSdk 24 }
    sourceSets.main { java.srcDirs = ['../src/main/kotlin'] }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    kotlinOptions { jvmTarget = '1.8' }
}
dependencies { compileOnly "io.flutter:flutter_embedding_debug:1.0.0-${System.getenv('FLUTTER_ENGINE_VERSION')}" }
