<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="identity_agent_ui">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>identity_agent_ui</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Catch Flutter web initialization errors and display them instead of white screen -->
  <div id="flutter-error" style="display:none;background:#0A1628;color:#FF4444;font-family:monospace;
    padding:40px;height:100vh;box-sizing:border-box;overflow:auto;">
    <h2 style="color:#FF6666;margin-top:0;">⚠ Flutter Web Error</h2>
    <pre id="flutter-error-msg" style="color:#FF8888;white-space:pre-wrap;font-size:13px;"></pre>
    <p style="color:#8B9DC3;margin-top:20px;font-size:12px;">
      Open browser DevTools (F12 → Console) for full details.
    </p>
  </div>
  <script>
    window.addEventListener('error', function(e) {
      var el = document.getElementById('flutter-error');
      var msg = document.getElementById('flutter-error-msg');
      if (el && msg) {
        msg.textContent = (msg.textContent ? msg.textContent + '\n\n' : '') +
          (e.message || e) + (e.filename ? '\n  at ' + e.filename + ':' + e.lineno : '');
        el.style.display = 'block';
      }
    });
    window.addEventListener('unhandledrejection', function(e) {
      var el = document.getElementById('flutter-error');
      var msg = document.getElementById('flutter-error-msg');
      if (el && msg) {
        msg.textContent = (msg.textContent ? msg.textContent + '\n\n' : '') +
          'Unhandled Promise: ' + (e.reason ? (e.reason.message || e.reason) : e);
        el.style.display = 'block';
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
