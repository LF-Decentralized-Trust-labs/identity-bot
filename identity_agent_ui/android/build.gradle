allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

// Inject proguard keep rules into every Android library module (including Flutter
// plugins like flutter_inappwebview) so R8 does not fail on missing
// android.window.BackEvent references introduced by Flutter 3.27+.
// Using plugins.withId avoids the afterEvaluate lifecycle conflict caused by
// evaluationDependsOn(":app") above.
subprojects {
    plugins.withId("com.android.library") {
        android {
            buildTypes {
                release {
                    // Apply to the module's own R8 pass (not just the consumer)
                    proguardFiles "${rootProject.projectDir}/app/proguard-rules.pro"
                    consumerProguardFiles "${rootProject.projectDir}/app/proguard-rules.pro"
                }
            }
        }
    }
}

// Pin plugin subprojects to Kotlin 1.9 language/API semantics so that deprecated
// APIs (e.g. nfc_manager 3.5.0's String.toLowerCase(Locale)) remain warnings
// rather than errors under Kotlin 2.x compiler.
subprojects {
    afterEvaluate {
        tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            kotlinOptions {
                languageVersion = "1.9"
                apiVersion = "1.9"
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
